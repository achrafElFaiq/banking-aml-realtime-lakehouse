name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy .

  lint-sql:
    name: SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: pip install sqlfluff
      - run: sqlfluff lint dbt_banking/models/ --dialect postgres

  dbt-test:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml_secret
          POSTGRES_DB: aml_lakehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aml"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Init prod_source schema
        run: psql -h localhost -U aml -d aml_lakehouse -f mock_data_sources/mock_prod_db/init_db/001_init_mock_prod_db.sql
        env:
          PGPASSWORD: aml_secret
      - name: Load fake customers
        run: uv run python -m mock_data_sources.mock_prod_db.load_fake_customers
      - name: Run dbt
        run: |
          cd dbt_banking
          uv run dbt deps
          uv run dbt build
        env:
          DBT_PROFILES_DIR: .
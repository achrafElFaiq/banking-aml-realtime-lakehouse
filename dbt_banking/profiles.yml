dbt_banking:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: SYSADMIN
      warehouse: AML_WH
      database: AML_LAKEHOUSE
      schema: GOLD
      threads: 4
    ci:
      type: snowflake
      account: dummy
      user: dummy
      password: dummy
      role: SYSADMIN
      warehouse: AML_WH
      database: AML_LAKEHOUSE
      schema: GOLD
      threads: 1
version: 2

models:
  - name: stg_transactions
    description: "Cleaned transactions from bronze"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: sender_iban_hmac
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              value: 64
      - name: amount_eur
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: status
        tests:
          - accepted_values:
              values: ['PENDING', 'SETTLED', 'BLOCKED']

  - name: stg_customers
    description: "Cleaned customers from bronze"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: iban_hmac
        tests:
          - unique
          - not_null
      - name: risk_tier
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'PEP']
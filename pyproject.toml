[project]
name = "banking-aml-realtime-lakehouse"
version = "0.1.0"
description = "End-to-end hybrid (Lambda) AML/LCB-FT data platform with streaming and batch layers, built on synthetic French banking data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.37.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]


[tool.ruff]
line-length = 99
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.mypy]
strict = true
